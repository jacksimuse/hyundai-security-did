<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>현대자동차 물리보안 캠페인</title>
<style>
  /* ── 폰트 ── */
  @font-face{font-family:'HyundaiSans';src:url('HyundaiSansHeadOffice-Bold.ttf') format('truetype');font-weight:700;}
  @font-face{font-family:'HyundaiSans';src:url('HyundaiSansHeadOffice-Regular.ttf') format('truetype');font-weight:400;}

  /* ── 리셋 ── */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#00193B;
    font-family:'HyundaiSans','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{display:flex;align-items:center;justify-content:center;}
  /* 키오스크 : 조작이 없으면 마우스 커서를 감춘다 */
  body.idle, body.idle *{cursor:none;}

  /* ── 스테이지 : 원본 이미지 비율(2161 × 3841) 고정 ── */
  #stage{
    position:relative;overflow:hidden;background:#00193B;
    font-size:min(1vw, calc(1vh * 2161 / 3841));   /* 1em = 스테이지 폭의 1% */
    width:min(100vw, calc(100vh * 2161 / 3841));
    height:min(100vh, calc(100vw * 3841 / 2161));
  }

  /* ── 화면 공통 ── */
  .screen{position:absolute;inset:0;display:none;
    background-repeat:no-repeat;background-position:center;background-size:100% 100%;}
  .screen.active{display:block;}

  /* ── 시계 ── */
  /* 시계 : 배경의 HYUNDAI 워드마크와 글자 크기·높이를 맞춤
     (워드마크 대문자 높이 51px / 2161px 기준 → 3.47em, 좌우 여백도 로고와 대칭) */
  #clock{position:absolute;top:9.13%;right:12.22%;color:#fff;
    font-family:'HyundaiSans','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    font-size:3.47em;line-height:1;font-weight:700;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    pointer-events:none;z-index:50;}

  /* ══════════ 1. 시작 화면 ══════════ */
  #screen-start{background-image:url('배경_첫화면.png');}

  /* ══════════ 3. 마지막 화면 ══════════ */
  #screen-final{background-image:url('배경_마지막 화면.png');}

  /* ── 버튼 (두 화면 공통 위치) ── */
  .btn{position:absolute;left:11.106%;top:67.586%;width:77.788%;
    border:0;padding:0;background:none;cursor:pointer;line-height:0;
    -webkit-user-select:none;user-select:none;z-index:20;}
  .btn img{width:100%;display:block;pointer-events:none;
    transition:transform .12s cubic-bezier(.4,0,.2,1);}
  .btn:active img{transform:scale(.94);}
  .btn img.pop{animation:btnPop .34s cubic-bezier(.34,1.56,.64,1);}
  @keyframes btnPop{
    0%{transform:scale(.94);}
    55%{transform:scale(1.05);}
    100%{transform:scale(1);}
  }

  /* ── 마지막 화면 요소 ── */
  #fx-text{position:absolute;left:0;top:25.384%;width:100%;}
  #fx-done{position:absolute;left:28.181%;top:39.391%;width:43.545%;
    perspective:110em;                       /* 입체감 깊이 */
    --half:3.9em;}                           /* 코인 두께의 1/2 */
  #fx-done .coin{position:relative;width:100%;transform-style:preserve-3d;}
  #fx-done .face{position:relative;width:100%;display:block;backface-visibility:hidden;}
  #fx-done .face.front{transform:translateZ(var(--half));}
  #fx-done .face.back{position:absolute;top:0;left:0;transform:rotateY(180deg) translateZ(var(--half));}
  /* 옆면(두께) : 뱃지 외곽선을 따라 48개의 판을 원통형으로 세워 실제 두께를 만듦 (JS 생성) */
  #fx-done .rim{position:absolute;left:50%;top:50%;
    width:calc(var(--half) * 2);
    background:linear-gradient(90deg,#0083a3 0%,#00b2da 45%,#0098bd 100%);}
  #fx-text img{width:100%;display:block;}

  /* 등장 애니메이션 (마지막 화면 진입 시 JS로 재생) */
  #screen-final.play #fx-text{animation:riseUp .8s cubic-bezier(.22,1,.36,1) .1s both;}
  #screen-final.play #fx-done .coin{animation:badgeFlip 1.4s cubic-bezier(.4,0,.6,1) .1s both;}
  @keyframes riseUp{
    from{opacity:0;transform:translateY(90px);}
    to{opacity:1;transform:translateY(0);}
  }
  /* 뱃지 : 동전이 옆으로 넘어가듯 세로축 기준 입체 회전 (한 바퀴, 1회만) */
  @keyframes badgeFlip{
    from{transform:rotateY(0deg);}
    to  {transform:rotateY(360deg);}
  }

  /* ══════════ 2. 영상 화면 ══════════ */
  #screen-video{background:#000;}
  #screen-video video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;background:#000;opacity:0;transition:opacity .18s linear;}
  #screen-video video.on{opacity:1;}
</style>
</head>
<body>

<div id="stage">

  <!-- ── 1. 시작 화면 ── -->
  <div id="screen-start" class="screen active">
    <button id="btn-start" class="btn" aria-label="참여 시작하기">
      <img src="버튼_마지막 화면.png" alt="참여 시작하기" />
    </button>
  </div>

  <!-- ── 2. 영상 재생 ── -->
  <div id="screen-video" class="screen">
    <video id="pA" playsinline preload="auto"></video>
    <video id="pB" playsinline preload="auto"></video>
  </div>

  <!-- ── 3. 마지막 화면 ── -->
  <div id="screen-final" class="screen">
    <div id="fx-text"><img src="효과_아래서 위로.png" alt="시청 완료! 스태프에게 도장을 받고 다음 단계로 이동하세요." /></div>
    <div id="fx-done">
      <div class="coin">
        <img class="face front" src="효과_완료.png" alt="완료" />
        <img class="face back"  src="효과_완료.png" alt="" />
      </div>
    </div>
    <button id="btn-back" class="btn" aria-label="처음으로">
      <img src="버튼_첫화면.png" alt="처음으로" />
    </button>
  </div>

  <!-- ── 시계 ── -->
  <div id="clock">오전 00:00</div>

</div>

<script>
/* ════════ 뱃지 옆면(두께) 생성 ════════
   효과_완료.png의 외곽선을 96방향에서 실측한 반지름(em)이다.
   이웃한 두 외곽점을 잇는 판을 세워 옆면을 만들기 때문에,
   옆면·뒷면도 앞면과 똑같이 울퉁불퉁한 실루엣을 따라간다. ── */
(function buildCoinRim(){
  const coin = document.querySelector('#fx-done .coin');
  if (!coin) return;
  const R = [
    21.06,20.79,20.18,19.45,18.94,18.82,19.10,19.68,20.44,20.97,21.03,20.55,
    19.82,19.19,18.82,18.86,19.34,20.01,20.68,21.05,20.88,20.23,19.55,19.01,
    18.79,19.01,19.55,20.29,20.88,21.05,20.68,19.95,19.29,18.86,18.81,19.19,
    19.82,20.55,21.03,20.95,20.38,19.68,19.10,18.79,18.94,19.44,20.14,20.79,
    21.06,20.79,20.14,19.44,18.94,18.79,19.10,19.68,20.38,20.95,21.03,20.55,
    19.82,19.19,18.82,18.86,19.29,19.95,20.68,21.05,20.88,20.29,19.55,19.01,
    18.79,19.01,19.55,20.23,20.88,21.05,20.68,20.01,19.34,18.86,18.82,19.19,
    19.82,20.55,21.05,20.97,20.44,19.68,19.10,18.82,18.94,19.45,20.18,20.79];
  const N = R.length;
  const INSET = 0.995;   /* 앞뒷면 실루엣보다 아주 살짝 안쪽 */
  const pt = k => {
    const a = 2 * Math.PI * (k % N) / N, r = R[k % N] * INSET;
    return [r * Math.cos(a), r * Math.sin(a)];
  };
  const frag = document.createDocumentFragment();
  for (let k = 0; k < N; k++){
    const [x1,y1] = pt(k), [x2,y2] = pt(k + 1);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1,       dy = y2 - y1;
    const len = Math.hypot(dx, dy) * 1.09;          /* 이음매가 안 보이게 살짝 겹침 */
    const deg = Math.atan2(dy, dx) * 180 / Math.PI - 90;
    const d = document.createElement('div');
    d.className = 'rim';
    d.style.height     = len.toFixed(3) + 'em';
    d.style.marginTop  = (-len / 2).toFixed(3) + 'em';
    d.style.marginLeft = 'calc(var(--half) * -1)';
    d.style.transform  =
      `translate3d(${mx.toFixed(3)}em, ${my.toFixed(3)}em, 0) rotateZ(${deg.toFixed(2)}deg) rotateY(90deg)`;
    frag.appendChild(d);
  }
  coin.appendChild(frag);
})();

/* ════════ 자동 진행 설정 ════════
   ── 터치가 안 되는 화면(일반 TV·모니터)에서 버튼 없이 저절로 순환하게 한다.
      손으로 누르는 터치 화면이라면 enabled 를 false 로 바꾸면 된다.
      시간 단위는 밀리초(1000 = 1초). ── */
const AUTO = {
  enabled:   true,
  startHold:  8000,   /* 시작 화면을 보여주는 시간 */
  finalHold: 12000    /* 완료 화면을 보여주는 시간 */
};

let autoTimer = null;
function clearAuto(){ if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; } }
function scheduleAuto(fn, ms){ clearAuto(); if (AUTO.enabled) autoTimer = setTimeout(fn, ms); }

/* ════════ 화면 전환 ════════ */
const screens = {
  start: document.getElementById('screen-start'),
  video: document.getElementById('screen-video'),
  final: document.getElementById('screen-final'),
};
const clockEl = document.getElementById('clock');

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  clockEl.style.display = (name === 'video') ? 'none' : 'block';
}

/* ════════ 시계 ════════ */
function updateClock(){
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  clockEl.textContent = `${h < 12 ? '오전' : '오후'} ${String(h % 12 || 12).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
updateClock();
setInterval(updateClock, 1000);

/* ════════ 버튼 누름 효과 (작아졌다 커짐) ════════ */
function pressEffect(btn, done){
  const img = btn.querySelector('img');
  img.classList.remove('pop');
  void img.offsetWidth;          /* 리플로우 → 애니메이션 재시작 */
  img.classList.add('pop');
  setTimeout(done, 180);         /* 효과가 보인 뒤 화면 전환 */
}

/* ════════ 영상 재생 (여러 편일 때는 플레이어 2개를 교차해 끊김 없이 이어 재생) ════════ */
const VIDEOS = ['0904.mp4'];
const players = [document.getElementById('pA'), document.getElementById('pB')];
let cur = 0, idx = 0;

function preload(playerIndex, videoIndex){
  if (videoIndex >= VIDEOS.length) return;
  const p = players[playerIndex];
  p.src = VIDEOS[videoIndex];
  p.load();
}

/* 첫 영상을 페이지가 열릴 때 미리 불러 첫 프레임까지 준비해 둔다.
   준비된 상태로 화면을 바꾸므로 전환 순간에 검은 화면이 스치지 않는다. */
function primeFirstVideo(){
  const p = players[0];
  if (p.getAttribute('src') !== VIDEOS[0]){
    p.src = VIDEOS[0];
    p.load();
  }
  const toStart = () => { try { p.currentTime = 0; } catch(e){} };
  if (p.readyState >= 1) toStart();
  else p.addEventListener('loadedmetadata', toStart, { once: true });
}

/* 감시 타이머 : 영상이 끝나야 할 시간이 지나도 안 끝나면 강제로 다음 순서로.
   무인 운영 중 파일 손상·재생 실패로 화면이 멈춰 있는 것을 막는다. */
let watchdog = null;
function clearWatchdog(){ if (watchdog){ clearTimeout(watchdog); watchdog = null; } }
function armWatchdog(p){
  clearWatchdog();
  const dur = (isFinite(p.duration) && p.duration > 0) ? p.duration * 1000 : 20000;
  watchdog = setTimeout(() => nextVideo(p), dur + 2000);
}

function playCurrent(){
  const p = players[cur];
  /* 화면에 나타나기 전에 먼저 불투명 상태로 만들어 페이드인 깜빡임을 없앤다 */
  players.forEach(v => { if (v !== p) v.classList.remove('on'); });
  p.classList.add('on');
  if (p.error){ nextVideo(p); return false; }  /* 이미 재생 불가면 바로 다음으로 */
  if (p.currentTime > 0.05) { try { p.currentTime = 0; } catch(e){} }
  const tryPlay = p.play();
  if (tryPlay && tryPlay.catch) tryPlay.catch(() => { p.muted = true; p.play(); });
  armWatchdog(p);
  p.addEventListener('loadedmetadata', () => { if (p.classList.contains('on')) armWatchdog(p); }, { once: true });
  preload(1 - cur, idx + 1);     /* 다음 영상 미리 로드 */
  return true;
}

function startSequence(){
  clearAuto();
  idx = 0; cur = 0;
  primeFirstVideo();                          /* 이미 준비돼 있으면 아무것도 하지 않는다 */
  if (playCurrent()) showScreen('video');     /* 첫 프레임을 붙인 뒤 화면을 바꾼다
                                                 (재생이 불가능하면 이미 완료 화면으로 넘어간 상태) */
}

function nextVideo(p){
  if (!p.classList.contains('on')) return;   /* 비활성 플레이어 이벤트 무시 */
  clearWatchdog();
  idx++;
  if (idx < VIDEOS.length){ cur = 1 - cur; playCurrent(); }
  else showFinal();
}

players.forEach(p => {
  p.addEventListener('ended', () => nextVideo(p));
  /* 영상 파일이 없거나 재생 불가일 때도 다음 순서로 넘어감 */
  p.addEventListener('error', () => nextVideo(p));
});

/* ════════ 마지막 화면 ════════ */
function showFinal(){
  clearWatchdog();
  players.forEach(v => { v.pause(); v.classList.remove('on'); });
  screens.final.classList.remove('play');
  void screens.final.offsetWidth;            /* 애니메이션 재시작 */
  showScreen('final');
  screens.final.classList.add('play');
  scheduleAuto(goToStart, AUTO.finalHold);   /* 잠시 뒤 시작 화면으로 */
}

/* ════════ 시작 화면으로 ════════ */
function goToStart(){
  clearWatchdog();
  /* 영상을 버리지 않고 첫 프레임으로 되감아 둔다 → 다음 참여 때도 깜빡임 없음 */
  players.forEach(v => { v.pause(); v.classList.remove('on'); });
  screens.final.classList.remove('play');
  showScreen('start');
  idx = 0; cur = 0;
  primeFirstVideo();
  scheduleAuto(startSequence, AUTO.startHold);   /* 잠시 뒤 자동으로 영상 재생 */
}

/* ════════ 버튼 이벤트 ════════ */
document.getElementById('btn-start').addEventListener('click', function(){
  pressEffect(this, startSequence);
});

document.getElementById('btn-back').addEventListener('click', function(){
  pressEffect(this, goToStart);
});

/* ════════ 마우스 커서 자동 숨김 (키오스크) ════════ */
let cursorTimer = null;
function poke(){
  document.body.classList.remove('idle');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}
document.addEventListener('mousemove', poke);
poke();

/* ════════ 시작 ════════ */
primeFirstVideo();                               /* 첫 영상 미리 준비 */
scheduleAuto(startSequence, AUTO.startHold);     /* 자동 진행 시작 */
</script>
</body>
</html>
